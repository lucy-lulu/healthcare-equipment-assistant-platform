name: NOV Frontend CI/CD

on:
  push:
    branches:
      - main
      # - deploy-test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend/code/nov-project
        run: npm ci

      - name: Build frontend
        working-directory: frontend/code/nov-project
        run: npm run build

      - name: Clean old frontend files
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            rm -rf /app/front/*

      - name: Prepare local dist folder
        run: |
          rm -rf ./dist
          mkdir -p ./dist
          cp -a frontend/code/nov-project/dist/. ./dist

      - name: Deploy frontend dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/app/front/"
